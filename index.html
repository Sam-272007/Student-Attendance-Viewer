<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-image: url("https://i.pinimg.com/1200x/1a/3c/c7/1a3cc786b3765e8016aaaccb32f5068d.jpg");
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      min-height: 100vh;
      color: #e0e0e0;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 15, 30, 0.6);
      pointer-events: none;
      z-index: -1;
    }

    .app {
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      background: rgba(30, 30, 50, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 50%, #ec4899 100%);
      color: white;
      padding: 30px 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      filter: blur(40px);
    }

    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      font-weight: 800;
      position: relative;
      z-index: 1;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.95;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }

    .filter-section {
      padding: 25px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .filter-group {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-label {
      font-weight: 600;
      color: #00d4ff;
      min-width: 130px;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn,
    .sort-btn {
      padding: 9px 14px;
      border: 2px solid rgba(0, 212, 255, 0.3);
      background: rgba(0, 212, 255, 0.05);
      color: #00d4ff;
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
      position: relative;
      overflow: hidden;
    }

    .filter-btn::before,
    .sort-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .filter-btn:hover,
    .sort-btn:hover {
      border-color: rgba(0, 212, 255, 0.6);
      background: rgba(0, 212, 255, 0.15);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
    }

    .filter-btn.active,
    .sort-btn.active {
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.4);
      font-weight: 700;
    }

    .sort-btn.reset {
      border-color: rgba(200, 200, 200, 0.3);
      color: #b0b0b0;
    }

    .sort-btn.reset:hover {
      background: rgba(200, 200, 200, 0.1);
      border-color: rgba(200, 200, 200, 0.5);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #e0e0e0;
      transition: all 0.3s ease;
    }

    .checkbox-label:hover {
      color: #00d4ff;
    }

    .checkbox-label input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: #00d4ff;
    }

    .results-info {
      padding: 12px 25px;
      background: rgba(0, 0, 0, 0.3);
      color: #00d4ff;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }

    .table-wrapper {
      padding: 0;
      max-height: 600px;
      overflow-y: auto;
    }

    .table-wrapper::-webkit-scrollbar {
      width: 8px;
    }

    .table-wrapper::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    .table-wrapper::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.3);
      border-radius: 4px;
    }

    .table-wrapper::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.6);
    }

    .students-table {
      width: 100%;
      border-collapse: collapse;
      background: transparent;
    }

    .students-table thead {
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 2px solid rgba(0, 212, 255, 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .students-table th {
      padding: 14px 18px;
      text-align: left;
      font-weight: 700;
      color: #00d4ff;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .students-table td {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .student-row {
      transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
    }

    .student-row:hover {
      background: rgba(0, 212, 255, 0.08);
      transform: translateX(4px);
      border-left: 3px solid rgba(0, 212, 255, 0.5);
      padding-left: 22px;
    }

    .student-row.selected {
      background: linear-gradient(90deg, rgba(124, 58, 237, 0.2) 0%, rgba(0, 212, 255, 0.1) 100%);
      border-left: 4px solid #7c3aed;
      padding-left: 21px;
    }

    .name-cell {
      font-weight: 700;
      color: #e0e0e0;
      font-size: 1rem;
    }

    .attendance-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-bar {
      flex: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      min-width: 100px;
      border: 1px solid rgba(0, 212, 255, 0.2);
    }

    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(0.23, 1, 0.320, 1);
      background: linear-gradient(90deg, #00d4ff 0%, #7c3aed 100%);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
    }

    .attendance-text {
      min-width: 40px;
      text-align: right;
      font-weight: 700;
      color: #00d4ff;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-good {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(34, 197, 94, 0.2) 100%);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }

    .badge-low {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.2) 100%);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }

    .badge-present {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(79, 70, 229, 0.2) 100%);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.4);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
    }

    .badge-absent {
      background: linear-gradient(135deg, rgba(209, 213, 219, 0.3) 0%, rgba(229, 231, 235, 0.3) 100%);
      color: #6b7280;
      border: 1px solid rgba(107, 114, 128, 0.4);
      box-shadow: 0 0 12px rgba(107, 114, 128, 0.15);
    }

    .empty-state {
      padding: 60px 25px;
      text-align: center;
      color: #888;
    }

    .empty-state p {
      font-size: 1rem;
      color: #b0b0b0;
      font-weight: 500;
    }

    .badge-container {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [students, setStudents] = useState([]);
      const [filter, setFilter] = useState("ALL");
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [showLowAttendance, setShowLowAttendance] = useState(false);
      const [sortOrder, setSortOrder] = useState("NONE");

      useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => res.json())
          .then((data) => {
            const updated = data.map((student) => ({
              ...student,
              attendance: Math.floor(Math.random() * 101),
              status: Math.random() > 0.5 ? "PRESENT" : "ABSENT",
            }));
            setStudents(updated);
          });
      }, []);

      const filteredStudents = students
        .filter((student) => {
          if (filter === "PRESENT") return student.status === "PRESENT";
          if (filter === "ABSENT") return student.status === "ABSENT";
          return true;
        })
        .filter((student) => {
          if (showLowAttendance) return student.attendance < 75;
          return true;
        })
        .sort((a, b) => {
          if (sortOrder === "ASC") return a.attendance - b.attendance;
          if (sortOrder === "DESC") return b.attendance - a.attendance;
          return 0;
        });

      return (
        <div className="app">
          <div className="container">
            <div className="header">
              <h1>🎓 Student Attendance Viewer</h1>
              <p className="subtitle">Track and monitor student attendance</p>
            </div>

            <div className="filter-section">
              <div className="filter-group">
                <span className="filter-label">Filter by Status:</span>
                <div className="button-group">
                  <button
                    className={`filter-btn ${filter === "ALL" ? "active" : ""}`}
                    onClick={() => setFilter("ALL")}
                  >
                    All Students
                  </button>
                  <button
                    className={`filter-btn ${filter === "PRESENT" ? "active" : ""}`}
                    onClick={() => setFilter("PRESENT")}
                  >
                    Present
                  </button>
                  <button
                    className={`filter-btn ${filter === "ABSENT" ? "active" : ""}`}
                    onClick={() => setFilter("ABSENT")}
                  >
                    Absent
                  </button>
                </div>
              </div>

              <div className="filter-group">
                <span className="filter-label">Sort:</span>
                <div className="button-group">
                  <button
                    className={`sort-btn ${sortOrder === "ASC" ? "active" : ""}`}
                    onClick={() => setSortOrder("ASC")}
                  >
                    ↑ Low to High
                  </button>
                  <button
                    className={`sort-btn ${sortOrder === "DESC" ? "active" : ""}`}
                    onClick={() => setSortOrder("DESC")}
                  >
                    ↓ High to Low
                  </button>
                  {sortOrder !== "NONE" && (
                    <button
                      className="sort-btn reset"
                      onClick={() => setSortOrder("NONE")}
                    >
                      ✕ Reset
                    </button>
                  )}
                </div>
              </div>

              <div className="filter-group">
                <label className="checkbox-label">
                  <input
                    type="checkbox"
                    checked={showLowAttendance}
                    onChange={() => setShowLowAttendance(!showLowAttendance)}
                  />
                  <span>Show only &lt; 75% attendance</span>
                </label>
              </div>
            </div>

            <div className="results-info">
              Showing {filteredStudents.length} of {students.length} students
            </div>

            <div className="table-wrapper">
              {filteredStudents.length > 0 ? (
                <table className="students-table">
                  <thead>
                    <tr>
                      <th>Student Name</th>
                      <th>Attendance Rate</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredStudents.map((student) => (
                      <tr
                        key={student.id}
                        onClick={() => setSelectedStudent(student.id)}
                        className={`student-row ${
                          selectedStudent === student.id ? "selected" : ""
                        }`}
                      >
                        <td className="name-cell">{student.name}</td>
                        <td className="attendance-cell">
                          <div className="progress-bar">
                            <div
                              className="progress-fill"
                              style={{
                                width: `${student.attendance}%`,
                              }}
                            />
                          </div>
                          <span className="attendance-text">{student.attendance}%</span>
                        </td>
                        <td>
                          <div className="badge-container">
                            <span
                              className={`badge ${
                                student.status === "PRESENT" ? "badge-present" : "badge-absent"
                              }`}
                            >
                              {student.status === "PRESENT" ? "✓ Present" : "✕ Absent"}
                            </span>
                            <span
                              className={`badge ${
                                student.attendance >= 75 ? "badge-good" : "badge-low"
                              }`}
                            >
                              {student.attendance >= 75 ? "✓ Good" : "⚠ Low"}
                            </span>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : (
                <div className="empty-state">
                  <p>No students match your filters</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
